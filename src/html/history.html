<html>
<head>
    <meta charset="UTF-8">
    <title>Lexin dictionary History</title>
    <!-- tokens first - everything below resolves its values from them -->
    <link href="../css/tokens.css" rel="stylesheet" type="text/css" />
    <link href="../css/components.css" rel="stylesheet" type="text/css" />
    <link href="../css/history.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <nav class="lxNav">
        <span class="lxNavBrand">Lexin — History</span>
        <a id="HistoryMenu" class="lxNavLink" href="history.html" aria-current="page">History</a>
        <a id="OptionsMenu" class="lxNavLink" href="options.html">Options</a>
        <a id="HelpMenu" class="lxNavLink" href="help.html">Help</a>
    </nav>

    <!-- One tab per Language Direction that has history, plus All. Built at runtime:
         a reader may have up to twenty, and most have two or three. -->
    <div class="lxTabs" id="directionTabs" role="tablist" aria-label="Language direction"></div>

    <div class="lxToolbar">
        <label class="lxSearch">
            <span class="lxSearchIcon" id="searchIcon"></span>
            <input id="historySearch" class="lxInput" type="search" autocomplete="off"
                placeholder="Search history" aria-label="Search history" />
        </label>
        <span class="lxToolbarSpacer"></span>
        <span class="lxCount" id="historyCount" aria-live="polite"></span>
        <div class="lxMenu">
            <button type="button" id="exportButton" class="lxButton lxButtonSecondary"
                aria-haspopup="menu" aria-expanded="false" aria-controls="exportMenu">Export ▾</button>
            <ul class="lxMenuList" id="exportMenu" role="menu" hidden>
                <li role="menuitem" tabindex="-1" data-format="tsv">TSV (Quizlet-ready)</li>
                <li role="menuitem" tabindex="-1" data-format="csv">CSV</li>
                <li role="menuitem" tabindex="-1" data-format="anki">Anki .txt</li>
                <li role="menuitem" tabindex="-1" data-format="clipboard">Copy to clipboard</li>
            </ul>
        </div>
        <button type="button" id="clearHistory" class="lxButton lxButtonGhost">Clear…</button>
    </div>

    <main class="lxPage">
        <div id="history"></div>
    </main>

    <script src="../scripts/history-main.js" type="module"></script>
</body>
</html>
