<html>

<head>
    <meta charset="UTF-8">
    <title>Lexin</title>
    <!-- tokens first - everything below resolves its values from them -->
    <link href="../css/tokens.css" rel="stylesheet" type="text/css" />
    <link href="../css/components.css" rel="stylesheet" type="text/css" />
    <link href="../css/translation-content.css" rel="stylesheet" type="text/css" />
    <link href="../css/popup.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <header class="lxPopupHeader">
        <span class="lxBrand">Lexin</span>
        <button type="button" id="optionsLink" class="lxButton lxButtonIcon" title="Open options"
            aria-label="Open options"></button>
    </header>

    <div class="lxPopupBody">
        <!-- One field, not two. Which of the old pair you typed in silently decided
             the lookup direction; the swap button and the badge say it out loud. -->
        <div class="lxSearchRow">
            <span class="lxSessionNav" id="sessionNav" hidden>
                <button type="button" id="historyBack" class="lxButton lxButtonIcon"
                    title="Previous lookup (Ctrl + ←)" aria-label="Previous lookup"></button>
                <button type="button" id="historyForward" class="lxButton lxButtonIcon"
                    title="Next lookup (Ctrl + →)" aria-label="Next lookup"></button>
            </span>
            <input id="wordInput" class="lxInput" type="text" autofocus="autofocus" autocomplete="off"
                placeholder="Sök ett ord…" aria-label="Word to translate" />
            <button type="button" id="swapDirection" class="lxButton lxButtonIcon"
                title="Swap translation direction" aria-label="Swap translation direction"></button>
            <span class="lxSeg" id="directionBadge">
                <span class="lxSegOption lxSegOptionSelected" id="directionBadgeText"></span>
            </span>
        </div>

        <div class="lxField">
            <label id="languageLabel">Language</label>
            <div id="languagePicker"></div>
        </div>

        <div class="lexinTranslationContainer">
            <div id="translation" class="lexinTranslationPopup" aria-live="polite">
            </div>
        </div>

        <div class="lxRecent" id="recent" hidden>
            <span class="lxRecentLabel">Recent</span>
            <div class="lxRecentChips" id="recentChips"></div>
        </div>
    </div>

    <script src="../scripts/popup-main.js" type="module"></script>

</body>

</html>
