name: E2E Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # The suite makes real, unmocked lookups against lexin.nada.kth.se and
  # folkets-lexikon.csc.kth.se, so it doubles as the only smoke detector for the
  # dictionaries changing under us: markup the parsing regexes no longer match, a
  # moved endpoint, or the `Access-Control-Allow-Origin: *` header the extension
  # relies on now that it ships no host permissions (docs/adr/0003-no-host-permissions.md).
  # Without a schedule that breakage surfaces as a user complaint, because nothing
  # else runs between pushes. Weekly and off the hour, to stay cheap and to avoid
  # the congestion GitHub sees at :00.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build Docker image
        run: |
          docker build -f Dockerfile.test -t lexin-extension-test .
      
      - name: Create output directories
        run: |
          mkdir -p playwright-report test-results
      
      - name: Run tests in Docker container
        id: test
        run: |
          docker run --rm \
            --name lexin-test \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            lexin-extension-test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

