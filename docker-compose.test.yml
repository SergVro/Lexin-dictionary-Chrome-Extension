services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      # Mount test results directories for easier access
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    environment:
      # Matches what the workflow passes: retries, the github reporter and
      # forbidOnly are all gated on CI in playwright.config.ts.
      - CI=true
    # Recommended for Chromium - without it, it can run out of memory and crash.
    ipc: host
    init: true
